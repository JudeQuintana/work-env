set -g prefix C-q

# Reload the file with Prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind | split-window -h # C-a | to create horizontal pane
bind - split-window -v # C-a - to create vertical pane

# moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes - C-a <arrow key>
bind -r Up    resize-pane -U 4
bind -r Down  resize-pane -D 4
bind -r Left  resize-pane -L 10
bind -r Right resize-pane -R 10

#set -g default-terminal "screen-256color"
set -g default-terminal "xterm-256color"

# enable vi keys
setw -g mode-keys vi
# snappier vi mode key response
set -sg escape-time 0
# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# be able to send shif+enter for new line in claude
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# for claude and vim
set -g focus-events on

# let escape sequences from apps (claude notifications, etc) reach iTerm
set -g allow-passthrough on

# truecolor for claude, diffs and the theme
set -as terminal-features ',xterm-256color:RGB'

# flag background windows in the status bar on bell/activity
set -g monitor-bell on
set -g monitor-activity on

# keep window numbers contiguous when one is closed
set -g renumber-windows on

# popup claude in the current pane's directory: prefix C
bind C display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "claude"

# click to scroll in claude and tmux panes, etc
set -g mouse on

#dont renmae windows automatically
set-option -g allow-rename off

#history limit
set -g history-limit 50000

# --tmux 3.6+--
#copy to clipboard
# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
# block selection like vim's C-v
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# let apps in panes (vim, remote shells) set the clipboard via OSC 52
# (needs "Applications in terminal may access clipboard" in iTerm2)
set -g set-clipboard on
# copy-pipe with no argument uses this
set -s copy-command pbcopy

bind-key -T copy-mode-vi y send-keys -X copy-pipe
#
# # Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# mouse drag copies to macOS clipboard and exits
# (hold Option in iTerm2 while dragging to bypass tmux and use native selection)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# wheel scroll speed in copy-mode (lines per tick)
bind-key -T copy-mode-vi WheelUpPane   send-keys -N 3 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -N 3 -X scroll-down

#clear window history (Cmd+Backspace in iTerm sends C-u)
bind -n C-u clear-history

#theme
source-file "${HOME}/projects/work-env-theme/tmux-themepack/powerline/default/blue.tmuxtheme"

set-option -g default-shell /bin/zsh

